<svg xmlns="http://www.w3.org/2000/svg" width="854" height="160" viewBox="0 0 854 160" fill="none">
  <defs>
    <clipPath id="top-card-clip">
      <path d="M0 0 L854 0 L854 160 L0 160 Z"/>
    </clipPath>
    <filter id="h-lift-conn" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>
  <g clip-path="url(#top-card-clip)">
    <rect width="854" height="160" fill="#dedede"/>

    <!-- Centered Circle -->
    <circle cx="427" cy="27" r="18" stroke="#111111" stroke-width="4" fill="none"/>

    <!-- Centered DETRACTLESS Title -->
    <g transform="translate(427, 78)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5px" font-weight="700" letter-spacing="3px" fill="#111111">
        DETRACTLESS
      </text>
      <text y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5px" font-weight="400" fill="#555555" letter-spacing="0.2px">
        Intentional computing, designed for how the brain actually works.
      </text>
    </g>

    <!-- Stats Pills Row (With balanced breathing room and Action-compatible IDs) -->
    <g transform="translate(53, 118)">
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="14" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#h-lift-conn)"/>
        <text id="val-commits" x="46" y="18" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5px" font-weight="700" fill="#111111">413</text>
        <text x="50" y="18" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="500" fill="#333333">commits</text>
      </g>
      <g transform="translate(150, 0)">
        <rect width="106" height="28" rx="14" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#h-lift-conn)"/>
        <text id="val-stars" x="40" y="18" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5px" font-weight="700" fill="#111111">9</text>
        <text x="44" y="18" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="500" fill="#333333">stars</text>
      </g>
      <g transform="translate(276, 0)">
        <rect width="110" height="28" rx="14" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#h-lift-conn)"/>
        <text id="val-repos" x="40" y="18" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5px" font-weight="700" fill="#111111">4</text>
        <text x="44" y="18" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="500" fill="#333333">repos</text>
      </g>
      <g transform="translate(406, 0)">
        <rect width="156" height="28" rx="14" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#h-lift-conn)"/>
        <text id="val-open" x="36" y="18" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5px" font-weight="700" fill="#111111">3</text>
        <text x="40" y="18" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="500" fill="#333333">open issues</text>
      </g>
      <g transform="translate(582, 0)">
        <rect width="166" height="28" rx="14" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#h-lift-conn)"/>
        <text id="val-closed" x="36" y="18" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5px" font-weight="700" fill="#111111">8</text>
        <text x="40" y="18" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="500" fill="#333333">closed issues</text>
      </g>
