<svg xmlns="http://www.w3.org/2000/svg" width="854" height="30" viewBox="0 0 854 30" fill="none">
  <defs>
    <clipPath id="top-bar-clip">
      <path d="M0 14 C0 6.27 6.27 0 14 0 L840 0 C847.73 0 854 6.27 854 14 L854 30 L0 30 Z"/>
    </clipPath>
    <style>
      @keyframes calmSlide {
        0% { transform: translateX(700px); opacity: 0; }
        14% { transform: translateX(427px); opacity: 1; }
        75% { transform: translateX(427px); opacity: 1; }
        89% { transform: translateX(154px); opacity: 0; }
        100% { transform: translateX(154px); opacity: 0; }
      }
      .calm-pill {
        animation: calmSlide 22s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
    </style>
  </defs>
  <g clip-path="url(#top-bar-clip)">
    <!-- Seamless matching background tone -->
    <rect width="854" height="30" fill="#dedede"/>
    <line x1="0" y1="29.5" x2="854" y2="29.5" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    
    <g class="calm-pill" text-anchor="middle">
      <rect x="-225" y="6" width="450" height="18" rx="9" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
      <text x="0" y="18.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10px" font-weight="600" fill="#333333" letter-spacing="0.25px">
        NOTICE: The two bottom buttons with arrows are interactive and clickable
      </text>
    </g>
  </g>
</svg>