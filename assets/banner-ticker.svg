<svg xmlns="http://www.w3.org/2000/svg" width="854" height="30" viewBox="0 0 854 30" fill="none">
  <defs>
    <clipPath id="top-bar-clip">
      <path d="M0 14 C0 6.27 6.27 0 14 0 L840 0 C847.73 0 854 6.27 854 14 L854 30 L0 30 Z"/>
    </clipPath>
    <style>
      @keyframes slideA {
        0% { transform: translateX(854px); opacity: 0; }
        12% { transform: translateX(427px); opacity: 1; }
        72% { transform: translateX(427px); opacity: 1; }
        84% { transform: translateX(-400px); opacity: 0; }
        100% { transform: translateX(-400px); opacity: 0; }
      }
      .dock-pill {
        animation: slideA 8.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
    </style>
  </defs>
  <g clip-path="url(#top-bar-clip)">
    <rect width="854" height="30" fill="#d2d2d2"/>
    <line x1="0" y1="29.5" x2="854" y2="29.5" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
    
    <g class="dock-pill" text-anchor="middle">
      <rect x="-225" y="6" width="450" height="18" rx="9" fill="rgba(255,255,255,0.85)" stroke="rgba(0,0,0,0.08)" stroke-width="0.75"/>
      <text x="0" y="18.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10px" font-weight="600" fill="#222222" letter-spacing="0.25px">
        NOTICE: The two bottom buttons with arrows are interactive and clickable
      </text>
    </g>
  </g>
</svg>