<svg xmlns="http://www.w3.org/2000/svg" width="854" height="160" viewBox="0 0 854 160" fill="none">
  <defs>
    <clipPath id="top-card-clip-emp">
      <path d="M0 0 L854 0 L854 160 L0 160 Z"/>
    </clipPath>
    <filter id="h-lift-emp" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>
  <g clip-path="url(#top-card-clip-emp)">
    <rect width="854" height="160" fill="#dedede"/>

    <!-- Centered Circle -->
    <circle cx="427" cy="27" r="18" stroke="#111111" stroke-width="4" fill="none"/>

    <!-- Centered EMPLOYMENT VALUE Title -->
    <g transform="translate(427, 78)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13px" font-weight="700" letter-spacing="3px" fill="#111111">
        EMPLOYMENT VALUE
      </text>
      <text y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5px" font-weight="400" fill="#555555" letter-spacing="0.2px">
        Listed below are the direct strengths and advantages of hiring me.
      </text>
    </g>

    <!-- 3 Concrete Value Pillars (Mockup B) -->
    <g transform="translate(107, 118)">
      <g transform="translate(0, 0)">
        <rect width="190" height="28" rx="14" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#h-lift-emp)"/>
        <text x="95" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="600" fill="#222222">Fast Learner &amp; Adaptable</text>
      </g>
      <g transform="translate(210, 0)">
        <rect width="210" height="28" rx="14" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#h-lift-emp)"/>
        <text x="105" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="600" fill="#222222">Client &amp; User Satisfaction</text>
      </g>
      <g transform="translate(440, 0)">
        <rect width="200" height="28" rx="14" fill="#f5f5f5" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#h-lift-emp)"/>
        <text x="100" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="600" fill="#222222">Reliable Feature Delivery</text>
      </g>
    </g>
  </g>
</svg>